name: Deploy iOS to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 🟢 1. CACHÉ DE KOTLIN/NATIVE (Evita redescargar el compilador de iOS)
      - name: Cache Konan (Kotlin/Native)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-v1-${{ hashFiles('**/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-konan-v1-

      # 🟢 2. CONFIGURACIÓN DE GRADLE CON CACHÉ DE TAREAS (v4)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Seleccionar Xcode
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Show Xcode Version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 🔑 CERTIFICADOS Y PROVISIONING PROFILE
      - name: Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          cp "$RUNNER_TEMP/profile.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision

      # 📦 INSTALACIÓN DE PODS
      - name: Install CocoaPods
        run: |
          cd iosApp
          pod install

      # 🛠️ COMPILACIÓN DEL ARCHIVO .XCARCHIVE
      - name: Build Archive
        run: |
          xcodebuild \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            archive

      # 📤 EXPORTACIÓN A IPA
      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/output

      - name: Verify Export
        run: |
          echo "========================"
          ls -lahR $RUNNER_TEMP/output

          IPA=$(find $RUNNER_TEMP/output -name "*.ipa" | head -1)

          if [ -z "$IPA" ]; then
            echo "IPA not found"
            exit 1
          fi

          echo "IPA: $IPA"
          ls -lh "$IPA"
          file "$IPA"
          unzip -t "$IPA"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-export
          path: ${{ runner.temp }}/output

      - name: Locate IPA
        run: |
          IPA=$(find $RUNNER_TEMP/output -name "*.ipa" | head -1)

          if [ -z "$IPA" ]; then
            echo "IPA not found."
            exit 1
          fi

          echo "IPA_PATH=$IPA" >> $GITHUB_ENV

      # 🚀 PUBLICACIÓN A TESTFLIGHT
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}